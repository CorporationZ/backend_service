spring:
  application:
    name: backend_service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_project
    username: user
    password: password
    driverClassName: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

services:
  s3:
    endpoint: http://localhost:9000
    minio-host: https://localhost:9000
    access-key: user
    secret-key: password
    bucket-name: user-project
    region: us-east-1