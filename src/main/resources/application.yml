server:
  port: 8080

spring:
  application:
    name: backend-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: my-group-id
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "uz.salikhdev.kafka_consumer.event"

  data:
    redis:
      host: localhost
      port: 6379
